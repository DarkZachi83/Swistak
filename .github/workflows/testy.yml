name: Testy
on:
  push:
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Biblioteki interfejsu
        run: pip install -r requirements.txt
      - name: Testy bazy i interfejsu
        run: timeout 120s python -m unittest discover -s testy -v
      - name: Sprawdzenie składni
        run: python -m compileall -q main.py baza gui uslugi testy konfiguracja.py
