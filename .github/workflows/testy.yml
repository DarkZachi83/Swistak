name: Testy
on:
  push:
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Biblioteki Qt, Tesseract i opcjonalny Poppler do porównania
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 tesseract-ocr tesseract-ocr-pol tesseract-ocr-eng poppler-utils fonts-dejavu-core
      - name: Zależności Python + testowa ścieżka Poppler
        run: pip install -r requirements-compare.txt
      - name: Audyt deklarowanych zależności i ich rejestru
        run: python -m tools.audyt_licencji --check
      - name: Audyt bezpieczeństwa i kompletności wydania AI Core 1.0
        run: python -m tools.audyt_ai_core --check
      - name: Wykaz plików licencyjnych i binarnych PDFium
        run: python -m tools.sprawdz_pdfium --json raport_licencje_pdfium.json
      - uses: actions/upload-artifact@v4
        with:
          name: licencje-pdfium-python-${{ matrix.python-version }}
          path: raport_licencje_pdfium.json
      - name: Testy bazy, OCR i interfejsu
        run: timeout 180s python -m unittest discover -s testy -v
      - name: Porównanie OCR PDFium vs Poppler — tylko syntetyczne PDF
        run: timeout 120s python -m tools.porownaj_ocr --json raport_ocr.json
      - uses: actions/upload-artifact@v4
        with:
          name: raport-ocr-python-${{ matrix.python-version }}
          path: raport_ocr.json
      - name: Sprawdzenie składni
        run: python -m compileall -q main.py ai_core baza gui uslugi testy konfiguracja.py tools wersja.py
      - name: Zbudowanie źródłowej paczki Świstak Linux Beta
        if: matrix.python-version == '3.11'
        run: python -m tools.build_linux_beta
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: swistak-linux-beta-source
          path: dist/swistak-linux-*-source.tar.gz
          if-no-files-found: error
