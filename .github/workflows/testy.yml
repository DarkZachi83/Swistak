name: Testy
on:
  push:
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Testy bez zależności GUI
        run: python -m unittest discover -s testy -v
      - name: Sprawdzenie składni
        run: python -m compileall -q main.py baza gui uslugi testy konfiguracja.py
