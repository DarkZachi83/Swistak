name: Testy
on:
  push:
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Biblioteki systemowe Qt i OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 poppler-utils tesseract-ocr tesseract-ocr-pol
      - name: Zależności Python
        run: pip install -r requirements.txt
      - name: Audyt deklarowanych zależności i ich rejestru
        run: python -m tools.audyt_licencji --check
      - name: Testy bazy i interfejsu
        run: timeout 180s python -m unittest discover -s testy -v
      - name: Sprawdzenie składni
        run: python -m compileall -q main.py baza gui uslugi testy konfiguracja.py tools
